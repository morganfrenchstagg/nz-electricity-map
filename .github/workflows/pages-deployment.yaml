name: Deploy Frontend
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'app/**'
      - '.github/workflows/pages-deployment.yaml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The same checks as pr-checks.yaml, so a push straight to main can't
      # deploy what a PR would have failed.
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Build React app
        working-directory: app
        run: npm run build
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend --project-name=nzelectricitymap --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
