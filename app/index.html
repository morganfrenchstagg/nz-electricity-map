<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NZ Electricity Map</title>
    <!-- The theme the viewer picked (light unless they picked dark) before first
         paint, so a dark page doesn't flash light. See src/theme.ts. -->
    <script>
      (function () {
        var theme = 'light'
        try { if (localStorage.getItem('theme') === 'dark') theme = 'dark' } catch (e) {}
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.add('highcharts-' + theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
